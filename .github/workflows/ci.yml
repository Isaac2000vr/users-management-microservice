name: Integracion y despliegue

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-test:
    name: Compilar y ejecutar pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Ejecutar la suite de pruebas
        run: mvn --batch-mode --no-transfer-progress clean verify

  docker-build:
    name: Construir la imagen Docker
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Construir la imagen
        run: docker build --tag users-management-api:ci .

  deploy:
    name: Desplegar en Render
    runs-on: ubuntu-latest
    needs:
      - build-test
      - docker-build
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Disparar el deploy hook
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"
